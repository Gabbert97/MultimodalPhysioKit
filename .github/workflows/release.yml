name: Publish Python package

on:
  release:
    types: [published]

jobs:
  build-distributions:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the published release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e python

      - name: Verify synthetic fixture reproducibility
        run: python tools/generate_synthetic_sample.py --check

      - name: Build sdist and wheel
        run: python -m build python --outdir dist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish-to-pypi:
    name: Publish distributions to PyPI
    runs-on: ubuntu-latest
    needs: build-distributions
    environment:
      name: pypi
      url: https://pypi.org/p/multimodalphysiokit
    permissions:
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
