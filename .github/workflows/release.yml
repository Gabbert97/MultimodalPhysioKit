name: Publish Python package

on:
  release:
    types: [published]
  # TEMPORARY: bootstrap support for publishing the existing v0.1.0 tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (for example, v0.1.0)
        required: true
        type: string

jobs:
  build-distributions:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    env:
      SOURCE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    permissions:
      contents: read

    steps:
      - name: Check out the selected release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.SOURCE_TAG }}
          persist-credentials: false

      - name: Validate selected release tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual bootstrap publication must be dispatched from the main branch." >&2
            exit 1
          fi
          if [[ "${SOURCE_TAG}" != v* ]]; then
            echo "Selected ref must be an existing release tag beginning with 'v'." >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${SOURCE_TAG}^{commit}" >/dev/null; then
            echo "Selected ref does not resolve to an existing Git tag: ${SOURCE_TAG}" >&2
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e python

      - name: Verify synthetic fixture reproducibility
        run: python tools/generate_synthetic_sample.py --check

      - name: Build sdist and wheel
        run: python -m build python --outdir dist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish-to-pypi:
    name: Publish distributions to PyPI
    runs-on: ubuntu-latest
    needs: build-distributions
    environment:
      name: pypi
      url: https://pypi.org/p/multimodalphysiokit
    permissions:
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
