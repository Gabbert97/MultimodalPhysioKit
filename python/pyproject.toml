[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodalphysiokit"
version = "0.1.0"
description = "Multimodal physiological signal processing for Python."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "COPYING.LESSER"]
authors = [
    { name = "Gabriele Luzzani" }
]
maintainers = [
    { name = "Gabriele Luzzani" }
]
keywords = [
    "physiological signals",
    "biosignal processing",
    "ECG",
    "EDA",
    "respiration",
    "temperature",
    "fNIRS",
    "human factors"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "numpy>=1.23.5",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4"
]
examples = [
    "pandas>=2",
    "ipython>=8",
    "jupyterlab>=4"
]

[project.urls]
Homepage = "https://github.com/Gabbert97/MultimodalPhysioKit"
Repository = "https://github.com/Gabbert97/MultimodalPhysioKit"
Issues = "https://github.com/Gabbert97/MultimodalPhysioKit/issues"
Documentation = "https://github.com/Gabbert97/MultimodalPhysioKit/tree/main/docs"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["multimodalphysiokit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
